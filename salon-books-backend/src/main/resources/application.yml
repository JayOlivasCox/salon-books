spring:
  application:
    name: salon-books-backend
  datasource:
    # Supabase: Project Settings > Database > Connection string > JDBC, use the SESSION pooler (port 5432)
    # or the direct connection. Do not use the transaction pooler (6543) with Flyway/JPA.
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

supabase:
  url: ${SUPABASE_URL}                  # https://<project-ref>.supabase.co
  secret-key: ${SUPABASE_SECRET_KEY}    # secret (sb_secret_...) or legacy service_role key. Server only.
  jwt-secret: ${SUPABASE_JWT_SECRET:}   # only set if the project still uses the legacy HS256 JWT secret
  receipts-bucket: receipts

app:
  invite-ttl-hours: 24
  deep-link-scheme: salonbooks
  max-sync-batch: 500

management:
  endpoints:
    web:
      exposure:
        include: health
